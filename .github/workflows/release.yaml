name: Go Release

on:
  workflow_dispatch:
  push:
    # 触发条件：当推送到 master 分支或创建新标签时运行
    # branches:
    #   - master
    tags:
      - 'v*'

permissions:
  contents: write
  
jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install MinGW-w64
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.x  # MCP Go SDK v1.7.0 requires Go 1.25+
        cache: true
    - name: Install Bee tool
      run: | # 安装 Bee 工具
        go install github.com/beego/bee/v2@latest

    # - name: Build for multiple platforms
    #   env:
    #     GOOS: linux darwin windows # 指定目标操作系统
    #     GOARCH: amd64 arm64 # 指定目标架构
    #   run: |
    #     for os in $GOOS; do
    #       for arch in $GOARCH; do
    #         output_name="myapp_${os}_${arch}"
    #         echo "Building for $os/$arch..."
    #         GOOS=$os GOARCH=$arch bee pack -o $output_name -be GOOS=$os GOARCH=$arch
    #       done
    #     done
        
    - name: Build and package for Linux
      # 构建并打包 Linux 版本, sqllite3 需要 CGO_ENABLED=1
      run: |
        export GOOS=linux
        export GOARCH=amd64
        export CGO_ENABLED=1
        mkdir -p "$RUNNER_TEMP/linux-package"
        bee pack \
          -a go_binance_futures \
          -o "$RUNNER_TEMP/linux-package" \
          -exr='.*\.tar\.gz$|(^|/)(skills-lock\.json|AGENTS\.md|qrcode\.jpg)$|(^|/)(strategy_templates|doc)(/|$)' \
          -be GOOS=$GOOS GOARCH=$GOARCH
        mv "$RUNNER_TEMP/linux-package/go_binance_futures.tar.gz" linux_amd64_feature.tar.gz

    - name: Build and package for Windows
      run: |
        export CC=x86_64-w64-mingw32-gcc
        export CXX=x86_64-w64-mingw32-g++
        export CGO_ENABLED=1
        export GOOS=windows
        export GOARCH=amd64
        mkdir -p "$RUNNER_TEMP/windows-package"
        bee pack \
          -a go_binance_futures \
          -o "$RUNNER_TEMP/windows-package" \
          -exr='.*\.tar\.gz$|(^|/)(skills-lock\.json|AGENTS\.md|qrcode\.jpg)$|(^|/)(strategy_templates|doc)(/|$)' \
          -be GOOS=$GOOS GOARCH=$GOARCH
        mv "$RUNNER_TEMP/windows-package/go_binance_futures.tar.gz" windows_amd64_feature.tar.gz

    - name: Verify release packages
      run: |
        tar -tzf linux_amd64_feature.tar.gz > "$RUNNER_TEMP/linux-package-contents.txt"
        tar -tzf windows_amd64_feature.tar.gz > "$RUNNER_TEMP/windows-package-contents.txt"

        grep -Fx 'go_binance_futures' "$RUNNER_TEMP/linux-package-contents.txt"
        grep -Fx 'go_binance_futures.exe' "$RUNNER_TEMP/windows-package-contents.txt"

        forbidden='(^|/)(skills-lock\.json|AGENTS\.md|qrcode\.jpg|strategy_templates(/|$)|doc(/|$))'
        if grep -Eq "$forbidden" "$RUNNER_TEMP/linux-package-contents.txt"; then
          echo "Linux package contains excluded release-only files"
          exit 1
        fi
        if grep -Eq "$forbidden" "$RUNNER_TEMP/windows-package-contents.txt"; then
          echo "Windows package contains excluded release-only files"
          exit 1
        fi
        
    - name: Release Tag
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        draft: false
        prerelease: false
        files: |
          linux_amd64_feature.tar.gz
          windows_amd64_feature.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Release Master
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/master')
      with:
        tag_name: Master
        draft: false
        prerelease: false
        files: |
          linux_amd64_feature.tar.gz
          windows_amd64_feature.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}